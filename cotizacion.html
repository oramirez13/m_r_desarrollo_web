<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solicite una cotización de M_R para su proyecto web."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M_R Web Design" />
    <meta property="og:title" content="Cotización | M_R Web Design" />
    <meta
      property="og:description"
      content="Solicite una cotización de M_R para su proyecto web."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/oramirez13/m_r_desarrollo_web/main/img/dominio.png"
    />
    <meta
      property="og:url"
      content="https://github.com/oramirez13/m_r_desarrollo_web"
    />
    <meta name="twitter:card" content="summary" />
    <title>Cotización | M_R Web Design</title>
    <link rel="icon" href="img/dominio.png" type="image/png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- El encabezado se inyecta desde partials/header.html -->
    <div data-include="partials/header.html"></div>

    <main id="contenido-principal">
      <section class="seccion">
        <div class="contenedor">
          <h1>Solicitar cotización</h1>
          <p>
            Complete los datos básicos del proyecto para preparar una propuesta
            inicial.
          </p>

          <form id="formCotizacion" class="formulario" novalidate>
            <div class="row">
              <div class="col-md-6 grupo-formulario">
                <label for="nombre"
                  >Nombre completo <span aria-hidden="true">*</span></label
                >
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  required
                  autocomplete="name"
                  placeholder="Su nombre"
                />
              </div>
              <div class="col-md-6 grupo-formulario">
                <label for="correo"
                  >Correo electrónico <span aria-hidden="true">*</span></label
                >
                <input
                  type="email"
                  id="correo"
                  name="correo"
                  required
                  autocomplete="email"
                  placeholder="correo@ejemplo.com"
                />
              </div>
            </div>

            <div class="grupo-formulario" id="telefonico">
              <label for="telefono"
                >Número telefónico <span aria-hidden="true">*</span></label
              >
              <div class="campo-telefono">
                <span class="prefijo-telefono" aria-hidden="true">+506</span>
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  required
                  inputmode="numeric"
                  pattern="[0-9]{8}"
                  maxlength="8"
                  placeholder="88888888"
                  autocomplete="tel-national"
                />
              </div>
            </div>

            <div class="grupo-formulario">
              <label for="tipo"
                >Tipo de proyecto <span aria-hidden="true">*</span></label
              >
              <select id="tipo" name="tipo" required>
                <option value="">Seleccione un tipo...</option>
                <option value="Landing page">Landing page</option>
                <option value="Web corporativa">Web corporativa</option>
                <option value="Catálogo digital">Catálogo digital</option>
              </select>
              <div id="nombreServicioFormulario" class="texto-ayuda"></div>
            </div>

            <div class="grupo-formulario">
              <label for="mensaje"
                >Descripción del proyecto
                <span aria-hidden="true">*</span></label
              >
              <textarea
                id="mensaje"
                name="mensaje"
                rows="5"
                required
                maxlength="500"
                placeholder="Describa brevemente su proyecto"
              ></textarea>
              <small class="texto-ayuda"
                >Caracteres: <span id="contador">0</span>/500</small
              >
            </div>

            <button type="submit" class="boton boton-principal">
              Enviar solicitud
            </button>

            <div
              id="mensajeConfirmacion"
              class="mensaje-confirmacion d-none"
              role="status"
            >
              Solicitud guardada correctamente.
            </div>
          </form>
        </div>
      </section>
    </main>

    <!-- El pie de pagina se inyecta desde partials/footer.html -->
    <div data-include="partials/footer.html"></div>

    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
